# Fly.io configuration. See DEPLOYING.md for the full sequence; the short form:
#
#   fly launch --no-deploy            # claims the app name, keeps this file
#   fly mpg create                    # tick PostGIS when prompted
#   fly mpg attach <cluster>          # sets DATABASE_URL as a secret
#   fly secrets set ANTHROPIC_API_KEY=sk-ant-...   # optional, enables /parse
#   fly deploy
#
# PostGIS must be selected when the cluster is created — it is a provisioning
# option, not something to add afterwards.

app = "atlasql"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # Zero would make the first visitor after an idle period wait for a cold
  # start, and this app warms its caches at boot precisely so nobody waits.
  min_machines_running = 1

  [[http_service.checks]]
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
