<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AtlasQL</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>AtlasQL</h1>
    <p class="tagline">Search the world itself, not dataset by dataset.</p>
  </header>

  <main>
    <section id="nl-panel" class="nl" aria-label="Ask in plain English" hidden>
      <label for="nl-text">Ask in plain English</label>
      <div class="nl-row">
        <textarea id="nl-text" rows="2"
          placeholder="cities above 2,000 m with more than 500,000 people"></textarea>
        <button type="button" id="parse">Parse</button>
      </div>
      <p class="hint" id="nl-status">
        Parsing fills in the form below. Nothing runs until you press Run query.
      </p>
    </section>

    <section class="builder" aria-label="Query builder">
      <div class="row">
        <label for="level">Level</label>
        <select id="level"></select>
        <span class="hint" id="level-hint"></span>
      </div>

      <fieldset>
        <legend>Conditions</legend>
        <div id="conditions"></div>
        <button type="button" id="add-condition" class="secondary">+ Add condition</button>
      </fieldset>

      <div class="row">
        <label for="sort-by">Sort by</label>
        <select id="sort-by"></select>
        <select id="order">
          <option value="desc">highest first</option>
          <option value="asc">lowest first</option>
        </select>
        <label for="top-n">Top</label>
        <input type="number" id="top-n" value="10" min="1" max="100">
      </div>

      <div class="row actions">
        <button type="button" id="run">Run query</button>
        <span class="hint" id="status"></span>
      </div>
    </section>

    <section id="error" class="error" hidden>
      <h2>This query cannot be answered</h2>
      <p id="error-message"></p>
      <p id="error-detail" class="hint"></p>
    </section>

    <section id="results-panel" hidden>
      <h2 id="results-summary"></h2>

      <div class="map">
        <canvas id="globe" aria-label="Results on a globe"></canvas>
        <div id="globe-tooltip" class="map-tooltip" hidden></div>
        <div class="map-controls">
          <button type="button" id="fit-results" class="secondary">Fit results</button>
          <button type="button" id="whole-globe" class="secondary">Whole globe</button>
        </div>
        <div id="map-legend" class="map-legend" hidden>
          <span id="legend-label"></span>
          <span id="legend-low" class="legend-end"></span>
          <span class="legend-ramp"></span>
          <span id="legend-high" class="legend-end"></span>
        </div>
        <p class="hint map-help">Drag to spin, scroll to zoom, click a region to select it.</p>
      </div>

      <div class="table-scroll">
        <table id="results">
          <thead><tr id="results-head"></tr></thead>
          <tbody id="results-body"></tbody>
        </table>
      </div>
    </section>

    <details id="filter-panel">
      <summary>GeoFilter sent to the API</summary>
      <pre id="filter-json"></pre>
    </details>
  </main>

  <!-- Classic scripts, so both are evaluated before the deferred module below
       and attach to window.d3. d3-array first: d3-geo resolves it from there. -->
  <script src="vendor/d3-array.v3.min.js"></script>
  <script src="vendor/d3-geo.v3.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
